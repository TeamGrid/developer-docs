<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">TeamGrid Developer</title>
  <desc id="description">Official documentation for the TeamGrid API, SDK, CLI, and MCP server.</desc>
  <rect width="1200" height="630" fill="#111216"/>
  <!-- The TeamGrid mark from public/teamgrid-mark.svg, scaled to 0.7 at x=80 y=72. -->
  <g fill="#5d85f5" transform="translate(80 72) scale(0.7)">
    <polygon points="53.822,59.575 40.337,73.231 40.337,0 53.822,13.656"/>
    <polygon points="32.971,57.527 19.485,69.134 19.485,4.097 32.971,15.705"/>
    <polygon points="12.12,52.064 0,61.623 0,13.656 12.12,21.167"/>
    <polygon points="61.188,59.575 74.673,73.231 74.673,0 61.188,13.656"/>
    <polygon points="82.039,57.527 95.524,69.134 95.524,4.097 82.039,15.705"/>
    <polygon points="102.89,52.064 115.01,61.623 115.01,13.656 102.89,21.167"/>
  </g>
  <!-- Same stack the site renders with; Inter is never loaded by the portal. -->
  <text x="80" y="290" fill="#f4f5f7" font-family="-apple-system, BlinkMacSystemFont, system-ui, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="82" font-weight="700" letter-spacing="-2.6">TeamGrid Developer</text>
  <text x="80" y="368" fill="#b9bec9" font-family="-apple-system, BlinkMacSystemFont, system-ui, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="34">API v1 · TypeScript SDK · CLI · MCP server</text>
  <text x="80" y="522" fill="#7f8795" font-family="-apple-system, BlinkMacSystemFont, system-ui, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="25">developer.teamgridapp.com</text>
</svg>
