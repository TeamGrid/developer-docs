name: Redeploy a verified documentation revision

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or tag to redeploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://developer.teamgridapp.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Verify documented packages remain public
        run: |
          set -euo pipefail
          version="$(node -p "require('./sources/packages.json').version")"
          for package in @teamgrid/api-client @teamgrid/cli @teamgrid/mcp-server; do
            [[ "$(npm view "$package@$version" version)" == "$version" ]]
          done
      - name: Redeploy the verified revision atomically
        run: >-
          npx wrangler pages deploy dist
          --project-name teamgrid-developer-docs
          --branch main
          --commit-hash "$(git rev-parse HEAD)"
          --commit-message "Verified manual redeploy"
          --commit-dirty=false
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npm run smoke:deployment -- https://developer.teamgridapp.com
