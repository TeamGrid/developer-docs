name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:functions
      - name: Verify generated files are committed
        run: git diff --exit-code
      - name: Preserve the exact verified site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: developer-docs-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  browser:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run browser and visual regression tests
        run: npm run test:browser
      - name: Preserve browser test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-report-${{ github.sha }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - verify
      - browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://developer.teamgridapp.com
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download the verified site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: developer-docs-${{ github.sha }}
          path: dist
      - name: Verify the documented packages are public
        id: packages
        run: |
          set -euo pipefail
          version="$(node -p "require('./sources/packages.json').version")"
          for attempt in {1..12}; do
            all_public=true
            for package in @teamgrid/api-client @teamgrid/cli @teamgrid/mcp-server; do
              published="$(npm view "$package@$version" version 2>/dev/null || true)"
              [[ "$published" == "$version" ]] || all_public=false
            done
            if [[ "$all_public" == "true" ]]; then
              echo "available=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [[ "$attempt" == "12" ]] || sleep 10
          done
          echo "available=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Documented packages are not public; refusing an explicit production deployment." >&2
            exit 1
          fi
          echo "Documented packages are not public yet; production deployment is deferred."
      - name: Deploy the verified commit to Cloudflare Pages
        if: steps.packages.outputs.available == 'true'
        run: >-
          npx wrangler pages deploy dist
          --project-name teamgrid-developer-docs
          --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-message "GitHub Actions deployment"
          --commit-dirty=false
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify the canonical production routes
        if: steps.packages.outputs.available == 'true'
        run: npm run smoke:deployment -- https://developer.teamgridapp.com
      - name: Record a deferred deployment
        if: steps.packages.outputs.available != 'true'
        run: >-
          echo 'The exact site was verified and preserved, but deployment is deferred until all
          documented npm packages are public. Re-run this workflow manually from the same main
          commit after package verification.' >> "$GITHUB_STEP_SUMMARY"
